[workspace]
name = "lab-9"
version = "0.1.0"
description = "Environment for Lab 9 clinical NLP"
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64"]

[tasks]
notebook = "jupyter notebook"
lab = "jupyter notebook Lab9.ipynb"
solutions = "jupyter notebook Lab9-solutions.ipynb"

[dependencies]
python = "3.11.*"
ipykernel = ">=6.29,<7"
notebook = ">=7,<8"
numpy = ">=2,<3"
pandas = ">=2.2,<3"
matplotlib = ">=3.9,<4"
scikit-learn = ">=1.6,<2"
